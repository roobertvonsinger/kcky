<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONBOARDED | Monitor de Cámara en Vivo & Validación Biométrica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06090e;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .monitor-card {
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(0, 240, 144, 0.25);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 960px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 144, 0.08);
            backdrop-filter: blur(12px);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .badge-live {
            background: rgba(0, 240, 144, 0.15);
            color: #00f090;
            border: 1px solid #00f090;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-live::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00f090;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f090;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        select, button {
            background: #161b22;
            border: 1px solid #30363d;
            color: #f0f6fc;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        button:hover {
            border-color: #00f090;
            color: #00f090;
        }
        .video-viewport-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Óvalo guía de validación biométrica KYC */
        .kyc-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kyc-oval {
            width: 240px;
            height: 320px;
            border: 2px dashed rgba(0, 240, 144, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
            position: relative;
            transform: translateY(-5%);
        }
        .kyc-oval::after {
            content: "ENCUADRE BIOMÉTRICO (OVAL KYC)";
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            color: #00f090;
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 16px;
        }
        .metric-label {
            font-size: 0.72rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f0f6fc;
            font-family: monospace;
        }
        .metric-value.highlight {
            color: #00f090;
        }
        .pixel-activity-bar {
            height: 6px;
            background: #21262d;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .pixel-activity-fill {
            height: 100%;
            width: 0%;
            background: #00f090;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div class="monitor-card">
        <div class="header">
            <div class="header-title">
                <span>📹</span> Monitor de Cámara Inyectada & DirectShow
            </div>
            <div class="badge-live" id="live-badge">STREAM ACTIVO & VALIDADO</div>
        </div>

        <div class="controls-bar">
            <select id="camera-select" onchange="switchCamera(this.value)">
                <option value="">Cargando dispositivos de video...</option>
            </select>
            <button onclick="startStream()">🔄 Reiniciar Cámara</button>
            <button onclick="takeSnapshot()">📸 Capturar Fotograma</button>
        </div>

        <div class="video-viewport-wrapper">
            <video id="webcam-video" autoplay playsinline muted></video>
            <div class="kyc-overlay">
                <div class="kyc-oval"></div>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Dispositivo Activo</div>
                <div class="metric-value highlight" id="dev-name">Detectando...</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Resolución Entregada</div>
                <div class="metric-value" id="dev-res">0x0</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Tasa de Cuadros (FPS)</div>
                <div class="metric-value highlight" id="dev-fps">0.0 FPS</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Brillo & Actividad de Píxeles</div>
                <div class="metric-value" id="dev-brightness">0% (Inactivo)</div>
                <div class="pixel-activity-bar">
                    <div class="pixel-activity-fill" id="pixel-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="hidden-canvas" width="320" height="180" style="display: none;"></canvas>

    <script>
        let currentStream = null;
        let frameCount = 0;
        let lastFpsCheck = performance.now();
        let fps = 0;

        async function populateDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const select = document.getElementById('camera-select');
                select.innerHTML = '';
                
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                if (videoDevices.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = "";
                    opt.textContent = "Cámara Inyectada / Predeterminada";
                    select.appendChild(opt);
                } else {
                    videoDevices.forEach((d, idx) => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label || `Cámara ${idx + 1} (${d.deviceId.slice(0, 8)}...)`;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.warn("Error listando dispositivos:", e);
            }
        }

        async function switchCamera(deviceId) {
            await startStream(deviceId);
        }

        async function startStream(preferredDeviceId = null) {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }

            const constraints = {
                video: preferredDeviceId ? { deviceId: { exact: preferredDeviceId } } : { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                const video = document.getElementById('webcam-video');
                video.srcObject = stream;
                
                await video.play().catch(e => console.log("Play error (ignorable):", e));

                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings ? track.getSettings() : {};
                
                document.getElementById('dev-name').textContent = track.label || "Cámara Inyectada Stealth";

                video.onloadedmetadata = () => {
                    document.getElementById('dev-res').textContent = `${video.videoWidth}x${video.videoHeight} (16:9)`;
                };

                await populateDevices();
                startPixelAnalyzer();
            } catch (err) {
                console.error("Error obteniendo stream:", err);
                document.getElementById('dev-name').textContent = "Error: " + err.message;
                document.getElementById('live-badge').textContent = "ERROR STREAM";
                document.getElementById('live-badge').style.borderColor = "#ff4d4f";
                document.getElementById('live-badge').style.color = "#ff4d4f";
            }
        }

        function startPixelAnalyzer() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('webcam-video');

            function analyze() {
                if (video.readyState >= 2) {
                    frameCount++;
                    const now = performance.now();
                    if (now - lastFpsCheck >= 1000) {
                        fps = (frameCount * 1000) / (now - lastFpsCheck);
                        document.getElementById('dev-fps').textContent = `${fps.toFixed(1)} FPS`;
                        frameCount = 0;
                        lastFpsCheck = now;
                    }

                    try {
                        ctx.drawImage(video, 0, 0, 320, 180);
                        const imgData = ctx.getImageData(0, 0, 320, 180);
                        let totalLum = 0;
                        const data = imgData.data;
                        for (let i = 0; i < data.length; i += 16) {
                            totalLum += (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
                        }
                        const avgLum = totalLum / (data.length / 16);
                        const percent = Math.min(100, Math.round((avgLum / 255) * 100));

                        document.getElementById('dev-brightness').textContent = `${percent}% Luminancia (${avgLum > 10 ? 'Activo' : 'Oscuro'})`;
                        document.getElementById('pixel-bar').style.width = `${Math.max(5, percent)}%`;
                    } catch (e) { }
                }
                requestAnimationFrame(analyze);
            }
            requestAnimationFrame(analyze);
        }

        function takeSnapshot() {
            const video = document.getElementById('webcam-video');
            const c = document.createElement('canvas');
            c.width = video.videoWidth || 1280;
            c.height = video.videoHeight || 720;
            const ctx = c.getContext('2d');
            ctx.drawImage(video, 0, 0, c.width, c.height);
            const dataUrl = c.toDataURL('image/png');
            const win = window.open();
            if (win) {
                win.document.write(`<img src="${dataUrl}" style="max-width:100%; border:2px solid #00f090; border-radius:8px;"/>`);
            }
        }

        window.addEventListener('DOMContentLoaded', () => startStream());
    </script>
</body>
</html>
