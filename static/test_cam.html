<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONBOARDED | Monitor de Cámara en Vivo & Validación Biométrica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06090e;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .monitor-card {
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid rgba(0, 240, 144, 0.25);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 240, 144, 0.08);
            backdrop-filter: blur(12px);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .badge-live {
            background: rgba(0, 240, 144, 0.15);
            color: #00f090;
            border: 1px solid #00f090;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-live::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00f090;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f090;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
        .video-viewport-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Óvalo guía de validación biométrica KYC */
        .kyc-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kyc-oval {
            width: 220px;
            height: 300px;
            border: 2px dashed rgba(0, 240, 144, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
            position: relative;
            transform: translateY(-5%);
        }
        .kyc-oval::after {
            content: "ENCUADRE BIOMÉTRICO (OVAL KYC)";
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            color: #00f090;
            font-size: 0.68rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 16px;
        }
        .metric-label {
            font-size: 0.72rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f0f6fc;
            font-family: monospace;
        }
        .metric-value.highlight {
            color: #00f090;
        }
    </style>
</head>
<body>
    <div class="monitor-card">
        <div class="header">
            <div class="header-title">
                <span>📹</span> Monitor de Cámara Inyectada
            </div>
            <div class="badge-live">STREAM ACTIVO & VALIDADO</div>
        </div>

        <div class="video-viewport-wrapper">
            <video id="webcam-video" autoplay playsinline muted></video>
            <div class="kyc-overlay">
                <div class="kyc-oval"></div>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Dispositivo Spoofeado</div>
                <div class="metric-value highlight" id="dev-name">Logitech HD Pro Webcam C920</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Resolución Entregada</div>
                <div class="metric-value" id="dev-res">1280x720 (16:9)</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Tasa de Cuadros (FPS)</div>
                <div class="metric-value highlight" id="dev-fps">30.0 FPS</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Estado de Validación</div>
                <div class="metric-value highlight">🟢 CERO EMULACIÓN DETECTABLE</div>
            </div>
        </div>
    </div>

    <script>
        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
                });
                const video = document.getElementById('webcam-video');
                video.srcObject = stream;
                
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings ? track.getSettings() : {};
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDev = devices.find(d => d.kind === 'videoinput');
                if (videoDev && videoDev.label) {
                    document.getElementById('dev-name').textContent = videoDev.label;
                }
                
                video.onloadedmetadata = () => {
                    document.getElementById('dev-res').textContent = `${video.videoWidth}x${video.videoHeight} (16:9)`;
                };
            } catch (err) {
                console.error("Error obteniendo stream:", err);
                document.getElementById('dev-name').textContent = "Error: " + err.message;
            }
        }
        window.addEventListener('DOMContentLoaded', startStream);
    </script>
</body>
</html>
